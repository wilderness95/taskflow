# Indítás: `cp .env.example .env`, töltsd ki, majd `docker compose up -d --build`.
# Nincs host-portkiengedés: kívülről csak a Cloudflare Tunnelen át érhető el.
# A tunnel ingress-ben egyetlen szabály kell: a saját domain -> http://web:80
# (a web konténer nginx-e az /api/* kéréseket az api-nak adja tovább).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_URL: ${APP_URL:?Állítsd be az APP_URL-t a .env fájlban}
      DATABASE_URL: /data/taskflow.db
      SEED: ${SEED:-true}
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Állítsd be a CLOUDFLARE_TUNNEL_TOKEN-t a .env fájlban}
    depends_on:
      - web
