server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Csatolmány-feltöltés (az API a MAX_UPLOAD_MB-vel korlátoz; a Cloudflare free csomag 100 MB).
  client_max_body_size 100m;

  # A frontend és az API egy origin alatt él (nincs CORS, a cookie first-party marad).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # A kliens IP-jét a Cloudflare adja (CF-Connecting-IP); ezt változatlanul továbbadjuk.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";
    # SSE (M5): ne pufferelje a választ.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # A hash-elt asset-ek örökké gyorsítótárazhatók.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: minden ismeretlen útvonal az index.html-re esik.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
