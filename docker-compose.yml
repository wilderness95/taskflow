# Indítás: `cp .env.example .env`, töltsd ki, majd `ops/deploy.sh` (mentés, ellenőrzés, visszaállás).
# Nincs host-portkiengedés: kívülről csak a Cloudflare Tunnelen át érhető el.
# A tunnel ingress-ben egyetlen szabály kell: a saját domain -> http://web:80
# (a web konténer nginx-e az /api/* kéréseket az api-nak adja tovább).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      APP_URL: ${APP_URL:?Állítsd be az APP_URL-t a .env fájlban}
      DATABASE_URL: /data/taskflow.db
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      SEED: ${SEED:-true}
      SESSION_SECRET: ${SESSION_SECRET:?Állíts be egy legalább 32 karakteres SESSION_SECRET-et a .env fájlban}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      MAIL_TRANSPORT: smtp
      MAIL_FROM: ${MAIL_FROM:?Állítsd be a MAIL_FROM-ot a .env fájlban}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Állítsd be az SMTP_USER-t a .env fájlban}
      SMTP_PASS: ${SMTP_PASS:?Állítsd be az SMTP_PASS-t a .env fájlban}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      API_KEY_RATE_LIMIT_MAX: ${API_KEY_RATE_LIMIT_MAX:-120}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      BACKUP_DIR: /backups
      # Hangasszisztens (opcionális): kulcs nélkül a hangvégpont 503 voice_unavailable.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.5-flash-native-audio-preview-12-2025}
      VOICE_MAX_SESSIONS_PER_USER: ${VOICE_MAX_SESSIONS_PER_USER:-2}
      VOICE_MAX_MINUTES: ${VOICE_MAX_MINUTES:-15}
    volumes:
      - ./data:/data
      # Csak olvasásra: az admin áttekintő innen mutatja az utolsó mentés idejét.
      - ./backups:/backups:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 3

  # Napi SQLite-mentés (konzisztens `.backup`, ellenőrzés, rotáció). Visszaállítás: docs/OPERATIONS.md.
  backup:
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      TZ: ${TZ:-Europe/Budapest}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./data:/data
      - ./backups:/backups
    # Egészséges, ha van 26 óránál frissebb adatbázis-mentés (a napi mentés + tartalék).
    healthcheck:
      test:
        ['CMD-SHELL', "find /backups -maxdepth 1 -name 'taskflow-*.db.gz' -mmin -1560 | grep -q ."]
      interval: 30m
      timeout: 10s
      start_period: 10m
      retries: 1
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    # A metrikák végpontja csak a konténeren belül érhető el (nincs portkiengedés); a healthcheck ezt kérdezi.
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', '--metrics', 'localhost:2000', 'ready']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Állítsd be a CLOUDFLARE_TUNNEL_TOKEN-t a .env fájlban}
    depends_on:
      - web
